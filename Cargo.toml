[package]
# 项目名称
name = "rsllm"
# 项目版本号
version = "0.1.0"
# 项目作者信息
authors = ["mxucc <litc10@qq.com>"]
# Rust 版本
edition = "2024"
# 默认运行的二进制文件
default-run = "rsllm"

[features]
# 编译特性配置
# 启用此选项来开启 storage_s3 或 cache_redis 功能
default = []
# 对象存储/S3 支持
storage_s3 = []
# Redis 缓存支持
cache_redis = ["redis"]
# Hugging Face tokenizer 支持（用于非OpenAI模型的精确token计算）
hf_tokenizers = ["tokenizers"]


# 查看更多配置键和定义请访问 https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
# 数据库ORM相关依赖
rbs = { version = "4.7.0" }              # RBatis schema，用于数据库结构定义
rbatis = { version = "4.6.15", features = [] }  # RBatis ORM框架
ulid = "1.2.1"                        # ULID生成器，用于生成唯一ID
rbdc-sqlite = { version = "4.7.0" }     # SQLite数据库驱动
#rbdc-mysql = { version = "4.7.0" }     # MySQL数据库驱动（已注释）
#rbdc-pg = { version = "4.7.0" }        # PostgreSQL数据库驱动（已注释）
#rbdc-mssql = { version = "4.7.0" }     # SQL Server数据库驱动（已注释）

# 异步运行时和核心库
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal"] }  # 异步运行时
tokio-stream = "0.1.18"  # Tokio流处理
async-stream = "0.3.6"  # 异步流生成器

# 序列化相关
serde = { version = "1.0.228", features = ["derive"] }  # 序列化框架
serde_json = "1.0.148"                                  # JSON序列化支持

# 日志系统
log = "0.4.29"                                          # 日志库
tracing = "0.1.44"                                      # 分布式日志追踪库
# fast_log配置：启用 features = ["lz4", "zip", "gzip"]，修改 src/config/log.rs 中的 choose_packer() 函数，在 application.json5 中添加 log_pack_compress: "zip"
fast_log = { version = "1.7.7" }                       # 高性能日志库

# Web框架
axum = { version = "0.8.8", features = ["macros", "ws"] }  # Web框架，添加ws特性支持WebSocket
axum-extra = { version = "0.10", features = ["typed-routing"] }  # Axum扩展，用于嵌入式静态文件
tower-http = { version = "0.6.8", features = ["fs","cors","limit"] }  # HTTP工具库
include_dir = "0.7"  # 嵌入目录到二进制文件
mime_guess = "2.0"  # MIME类型猜测

# 缓存系统
redis = { version = "1.0.2", features = ["tokio-comp"] ,optional = true}  # Redis客户端（可选）

# 安全相关
jsonwebtoken = { version = "10.2.0", features = ["use_pem", "rust_crypto"] }        # JWT令牌处理
md5 = "0.8.0"                 # MD5哈希算法
captcha = "1.0.0"           # 验证码生成
sha2 = "0.10.9"               # SHA2哈希算法
base64 = "0.22.1"             # Base64编码解码库
aes-gcm = "0.10.3"            # AES-GCM加密算法

# HTTP客户端和图像处理
reqwest = { version = "0.13.1", features = ["json", "stream"] }  # HTTP客户端，使用rust-tls替换native tls
reqwest-streams = "0.14.0"                               # HTTP流处理库
image = "0.25.9"                                    # 图像处理库
futures-util = "0.3.31"                            # Future工具库
parking_lot = "0.12.5"                         # 并发工具库

# 工具库
sqlparser = "0.60.0"       # SQL解析器
json5 = "1.3"              # JSON5解析器
rand = "0.9.2"             # 随机数生成器
tiktoken-rs = "0.9.1"        # Token计数库（OpenAI模型）
tokenizers = { version = "0.21", optional = true }  # Hugging Face tokenizer（非OpenAI模型）

# 云存储（可选）
async-trait = "0.1.89"     # 异步trait支持

# OpenAPI 文档依赖
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "openapi_extensions"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

# 其他未分类
futures = "0.3.31"
yup-oauth2 = "12.1"  # Google OAuth2认证库
governor = "0.6"            # 速率限制库
nonzero_ext = "0.3"         # 非零数字扩展


[build-dependencies]
# 构建时依赖
json5 = "1.3"               # JSON5解析器（构建时使用）
serde = { version = "1.0.228", features = ["derive"] }  # 序列化框架（构建时使用）
walkdir = "2.5.0"           # 目录遍历工具（构建时使用）

[profile.release]
# 发布版本优化配置
lto = true                  # 启用链接时优化，减小二进制文件大小
opt-level = 3               # 最高优化级别
codegen-units = 1           # 单一代码生成单元，提高优化效果