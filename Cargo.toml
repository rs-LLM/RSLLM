[package]
name = "rsllm"
version.workspace = true
edition.workspace = true
authors = ["mxucc <litc10@qq.com>"]
default-run = "rsllm"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["rsllm contributors"]
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.85"
futures-util = "0.3.30"
log = "0.4.22"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "2.0.3"
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
ulid = "1.2.0"
wasmtime = { version = "28.0", features = ["cranelift"] }
wasmtime-wasi = "28.0"
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.12", features = ["prost"] }
rbatis = "4.6.15"
rbs = "4.7.0"
rbdc-sqlite = "4.7.0"
tokio-test = "0.4"

[workspace]
members = [
    ".",
]

[features]
default = []
storage_s3 = []
cache_redis = ["redis"]
hf_tokenizers = ["tokenizers"]

[dependencies]
rbs = { version = "4.7.0" }
rbatis = { version = "4.6.15", features = [] }
ulid = "1.2.0"
rbdc-sqlite = { version = "4.7.0" }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1.18"
async-stream = "0.3.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
log = "0.4.29"
tracing = "0.1.44"
fast_log = { version = "1.7.7" }
axum = { version = "0.8.8", features = ["macros", "ws", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-routing"] }
tower-http = { version = "0.6.8", features = ["fs","cors","limit"] }
include_dir = "0.7"
mime_guess = "2.0"
redis = { version = "1.0.2", features = ["tokio-comp"] ,optional = true}
jsonwebtoken = { version = "10.2.0", features = ["use_pem", "rust_crypto"] }
md5 = "0.8.0"
captcha = "1.0.0"
sha2 = "0.10.9"
hmac = "0.12.1"
sha1 = "0.10"
base64 = "0.22.1"
data-encoding = "2.6"
aes-gcm = "0.10.3"
reqwest = { version = "0.12", features = ["json", "stream", "native-tls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-native-tls", "builder"] }
reqwest-streams = "0.14.0"
url = "2.5"
image = "0.25.9"
futures-util = "0.3.31"
parking_lot = "0.12.5"
sqlparser = "0.60.0"
json5 = "1.3"
rand = "0.9.2"
tiktoken-rs = "0.9.1"
tokenizers = { version = "0.21", optional = true }
async-trait = "0.1.89"
wasmtime = "28.0"
wasmtime-wasi = "28.0"
regex = "1.11"
utoipa = { version = "5.4.0", features = ["axum_extras", "openapi_extensions"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
futures = "0.3.31"
yup-oauth2 = "12.1"
governor = "0.6"
tokio-test = "0.4"
nonzero_ext = "0.3"
chrono = "0.4"
cron = "0.15"
anyhow = "1.0"
zip = "2.2"

[build-dependencies]
json5 = "1.3"
serde = { version = "1.0.228", features = ["derive"] }
walkdir = "2.5.0"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[dev-dependencies]
tempfile = "3.25.0"
tower = { version = "0.5", features = ["util"] }
