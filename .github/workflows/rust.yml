name: Build and Release RSLLM (64-bit only)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]

jobs:
  # Linux 64 位构建
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Build for Linux
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Linux binary
        run: |
          cp target/x86_64-unknown-linux-gnu/release/rsllm rsllm-linux-x86_64
          tar -czvf rsllm-linux-x86_64.tar.gz rsllm-linux-x86_64
          sha256sum rsllm-linux-x86_64.tar.gz > rsllm-linux-x86_64.tar.gz.sha256

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsllm-linux-x86_64
          path: |
            rsllm-linux-x86_64.tar.gz
            rsllm-linux-x86_64.tar.gz.sha256

  build-windows-gnu:
    runs-on: ubuntu-latest  # 在 Ubuntu 上交叉编译 Windows 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64-win32

      - name: Build for Windows (GNU)
        run: |
          # 设置环境变量避免 aws-lc-sys 问题
          export AWS_LC_SYS_NO_PREFIX=1
          export AWS_LC_SYS_NO_ASM=1
          export AWS_LC_SYS_SKIP_COMPILER_TESTS=1
          
          cargo build --release --target x86_64-pc-windows-gnu

      - name: Package Windows binary
        run: |
          cp target/x86_64-pc-windows-gnu/release/rsllm.exe rsllm-windows-x86_64.exe
          zip -j rsllm-windows-x86_64.zip rsllm-windows-x86_64.exe
          sha256sum rsllm-windows-x86_64.zip > rsllm-windows-x86_64.zip.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsllm-windows-x86_64
          path: |
            rsllm-windows-x86_64.zip
            rsllm-windows-x86_64.zip.sha256

  # macOS 64 位构建（Intel 和 ARM）
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install system dependencies
        run: |
          brew install pkg-config openssl@3

      - name: Build for macOS Intel
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for macOS ARM
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package macOS binaries
        run: |
          # Intel Mac
          cp target/x86_64-apple-darwin/release/rsllm rsllm-macos-x86_64
          tar -czvf rsllm-macos-x86_64.tar.gz rsllm-macos-x86_64
          shasum -a 256 rsllm-macos-x86_64.tar.gz > rsllm-macos-x86_64.tar.gz.sha256
          
          # ARM Mac
          cp target/aarch64-apple-darwin/release/rsllm rsllm-macos-aarch64
          tar -czvf rsllm-macos-aarch64.tar.gz rsllm-macos-aarch64
          shasum -a 256 rsllm-macos-aarch64.tar.gz > rsllm-macos-aarch64.tar.gz.sha256

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsllm-macos
          path: |
            rsllm-macos-x86_64.tar.gz
            rsllm-macos-x86_64.tar.gz.sha256
            rsllm-macos-aarch64.tar.gz
            rsllm-macos-aarch64.tar.gz.sha256

  # 发布到 GitHub Release
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          # 创建发布目录
          mkdir -p release
          
          # 收集所有构建产物
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;
          
          # 显示文件列表
          echo "Files for release:"
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}