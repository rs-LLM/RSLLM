name: Build and Release RSLLM

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]

jobs:
  # Linux 构建 (使用 Docker)
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, i686]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for Linux (${{ matrix.arch }})
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=docker,dest=/tmp/rsllm-linux-${{ matrix.arch }}.tar
          tags: rsllm:linux-${{ matrix.arch }}
          build-args: |
            TARGET=${{ matrix.arch }}-unknown-linux-gnu

      - name: Extract binary from Docker image
        run: |
          # 加载Docker镜像
          docker load --input /tmp/rsllm-linux-${{ matrix.arch }}.tar
          
          # 创建容器并复制二进制文件
          CONTAINER_ID=$(docker create rsllm:linux-${{ matrix.arch }})
          docker cp $CONTAINER_ID:/usr/local/bin/rsllm ./rsllm-linux-${{ matrix.arch }}
          docker rm $CONTAINER_ID
          
          # 打包
          tar -czvf rsllm-linux-${{ matrix.arch }}.tar.gz rsllm-linux-${{ matrix.arch }}
          sha256sum rsllm-linux-${{ matrix.arch }}.tar.gz > rsllm-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsllm-linux-${{ matrix.arch }}
          path: |
            rsllm-linux-${{ matrix.arch }}.tar.gz
            rsllm-linux-${{ matrix.arch }}.tar.gz.sha256

  # Windows 构建 (原生)
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Windows dependencies
        run: |
          # 安装Windows构建工具
          choco install -y llvm
          refreshenv

      - name: Set environment variables for aws-lc-sys
        run: |
          # 设置环境变量来解决aws-lc-sys问题
          echo "AWS_LC_SYS_NO_PREFIX=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "AWS_LC_SYS_NO_ASM=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows binary
        run: |
          cargo build --release --target ${{ matrix.target }}
          
          # 根据架构确定文件名
          if ("${{ matrix.target }}" -eq "x86_64-pc-windows-msvc") {
            $arch = "x86_64"
          } else {
            $arch = "i686"
          }
          
          # 复制二进制文件
          Copy-Item "target\${{ matrix.target }}\release\rsllm.exe" "rsllm-windows-$arch.exe"
          
          # 压缩
          Compress-Archive -Path "rsllm-windows-$arch.exe" -DestinationPath "rsllm-windows-$arch.zip" -Force
          
          # 计算SHA256
          $hash = (Get-FileHash "rsllm-windows-$arch.zip" -Algorithm SHA256).Hash
          $hash | Out-File -Encoding ASCII "rsllm-windows-$arch.zip.sha256"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsllm-windows-${{ matrix.target }}
          path: |
            rsllm-windows-*.zip
            rsllm-windows-*.sha256

  # macOS 构建 (原生)
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install macOS dependencies
        run: |
          # 安装必要的开发工具
          brew install pkg-config
          brew install openssl@3

      - name: Build macOS binary
        run: |
          # 设置OpenSSL路径
          export PKG_CONFIG_PATH="/usr/local/opt/openssl@3/lib/pkgconfig"
          cargo build --release --target ${{ matrix.target }}
          
          # 确定架构和文件名
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            arch="x86_64"
          else
            arch="aarch64"
          fi
          
          # 复制并打包
          cp target/${{ matrix.target }}/release/rsllm rsllm-macos-$arch
          tar -czvf rsllm-macos-$arch.tar.gz rsllm-macos-$arch
          shasum -a 256 rsllm-macos-$arch.tar.gz > rsllm-macos-$arch.tar.gz.sha256

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsllm-macos-${{ matrix.target }}
          path: |
            rsllm-macos-*.tar.gz
            rsllm-macos-*.sha256

  # 发布到 GitHub Release
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          # 创建发布目录
          mkdir -p release
          
          # 收集所有构建产物
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;
          
          # 显示文件列表
          echo "Files for release:"
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}